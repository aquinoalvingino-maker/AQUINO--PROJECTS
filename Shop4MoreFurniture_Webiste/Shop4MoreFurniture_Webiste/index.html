<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop 4 More Furniture Inventory System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            height: 100vh;

            background:
                linear-gradient(rgba(107, 16, 32, .85), rgba(107, 16, 32, .85)),
                url("https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .container-box {

            width: 520px;

            background: white;

            border-radius: 20px;

            padding: 45px;

            text-align: center;

            box-shadow: 0 20px 40px rgba(0, 0, 0, .35);

            animation: fade 1s;

        }

        /* LOGO */

        .logo {

            display: block;

            width: 190px;

            margin: 0 auto 25px;

            border-radius: 12px;

        }

        h1 {

            color: #6B1020;

            font-weight: bold;

            margin-bottom: 8px;

        }

        h4 {

            color: #666;

            margin-bottom: 25px;

        }

        p {

            color: #555;

            line-height: 1.7;

        }

        .btn-enter {

            display: inline-block;

            margin-top: 20px;

            background: #6B1020;

            color: white;

            padding: 15px 45px;

            border-radius: 35px;

            text-decoration: none;

            font-size: 18px;

            transition: .3s;

        }

        .btn-enter:hover {

            background: #8b1530;

            color: white;

            transform: translateY(-3px);

        }

        .footer {

            margin-top: 35px;

            color: gray;

            font-size: 14px;

        }

        @keyframes fade {

            from {

                opacity: 0;

                transform: translateY(30px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }
    </style>

</head>

<body>

    <div class="container-box">

        <!-- LOGO -->

        <img src="assets/ICON.jpg" alt="Shop 4 More Logo" class="logo">

        <h1>SHOP 4 MORE</h1>

        <h4>Furniture Inventory Management System</h4>

        <p>
            Manage furniture inventory, suppliers, customers, purchase orders,
            stock movements, and reports through one centralized system.
        </p>

        <a href="dashboard.html" class="btn-enter">

            <i class="fas fa-right-to-bracket"></i>

            Enter System

        </a>

        <div class="footer">

           Aliyah F. Lopez | IE-401 

        </div>

    </div>

</body>

</html>
