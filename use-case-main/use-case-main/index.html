<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where in AUF? - Campus Map & Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --auf-blue: #002B66;
    --auf-blue-light: #004499;
    --auf-blue-dark: #001A3E;
    --auf-gold: #FFC72C;
    --bg-light: #F4F7FA;
    --card-bg: #FFFFFF;
    --text-main: #1C2833;
    --text-muted: #566573;
    --border-color: #D5DBDB;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-light);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
  }

  header {
    background: var(--auf-blue-dark);
    color: #FFFFFF;
    padding: 20px;
    border-bottom: 5px solid var(--auf-gold);
  }
  .header-inner {
    max-width: 1160px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .wordmark-logo-img {
    height: 52px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(30px, 5vw, 42px);
    margin: 0;
    color: #FFFFFF;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--auf-gold); }
  .tagline {
    font-size: 14px;
    color: #D0E1F9;
    margin: 0;
  }

  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0, 43, 102, 0.05);
  }

  .ask-panel { padding: 22px; }
  
  details.directory {
    margin-bottom: 18px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: #F8FAFC;
  }
  details.directory summary {
    cursor: pointer;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--auf-blue);
    user-select: none;
  }
  #context {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    border: none;
    border-top: 1px solid var(--border-color);
    background: #FFFFFF;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--text-main);
    resize: vertical;
    line-height: 1.5;
  }

  .ask-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  #question {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid var(--border-color);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--text-main);
  }
  #question:focus {
    outline: none;
    border-color: var(--auf-blue-light);
  }
  button#ask {
    background: var(--auf-blue);
    color: #FFFFFF;
    border: none;
    padding: 0 20px;
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
  }
  button#ask:hover { background: var(--auf-blue-light); }
  button#ask:disabled { background: #A0AEC0; cursor: wait; }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }
  .examples button {
    background: #EBF3FF;
    border: 1px solid #C2DCFF;
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--auf-blue);
    cursor: pointer;
  }
  .examples button:hover {
    background: var(--auf-blue);
    color: #FFFFFF;
  }

  #status {
    font-size: 12.5px;
    color: var(--text-muted);
    min-height: 18px;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .answer-card {
    border-left: 5px solid var(--auf-blue);
    background: #F0F5FF;
    padding: 16px 18px;
    border-radius: 6px;
    display: none;
  }
  .answer-card.show { display: block; }
  .answer-card .location-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--auf-blue);
    margin-bottom: 8px;
  }
  .answer-card .details {
    font-size: 14.5px;
    color: var(--text-main);
    line-height: 1.5;
  }
  .answer-card .details p { margin: 4px 0; }
  .answer-card .details ul { margin: 4px 0 0 18px; padding: 0; }

  /* Map Styling */
  .map-panel {
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    padding: 18px;
    position: sticky;
    top: 20px;
  }
  .map-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--bg-light);
    padding-bottom: 8px;
  }
  .map-title span.label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--auf-blue);
  }
  .map-title span.showing {
    font-size: 12px;
    color: var(--auf-blue-light);
    font-weight: 600;
  }
  
  svg#campusmap { width: 100%; height: auto; display: block; background: #F8FAFC; border-radius: 6px; border: 1px solid #E2E8F0; }
  
  .bldg rect, .bldg polygon {
    stroke: #FFFFFF;
    stroke-width: 1.5;
    transition: all 0.3s ease;
  }
  .bldg text {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    pointer-events: none;
  }
  .bldg.active rect, .bldg.active polygon {
    stroke: var(--auf-gold) !important;
    stroke-width: 3.5 !important;
    filter: drop-shadow(0 0 6px rgba(0, 43, 102, 0.4));
  }

  .legend {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>

    {
      key: 'medical',
      name: 'AUF Medical Center',
      words: ['medical center', 'hospital', 'aufmc'],
      summary: '<strong>AUF Medical Center:</strong> Main university hospital complex.'
    },
    {
      key: 'jollibee',
      name: 'Jollibee',
      words: ['jollibee'],
      summary: '<strong>Jollibee:</strong> Fast food outlet outside campus along MacArthur Highway.'
    }
  ];

  // MULTI-LOCATION TRIGGERS
  const CANTEEN_TRIGGERS = ['canteen', 'canteens', 'food', 'cafeteria', 'dining', 'eat', 'eating', 'cabalen'];
  const LIBRARY_TRIGGERS = ['library', 'libraries', 'study hall', 'law library', 'learning commons'];
  const CLINIC_TRIGGERS = ['clinic', 'clinics', 'health services', 'doctor', 'medical clinic', 'nurse clinic', 'uhs'];
  const GUIDANCE_TRIGGERS = ['guidance', 'counselor', 'counseling', 'a-303', 'eya-101', 'eya 101', 'a 303'];

  function highlightKeys(keys) {
    document.querySelectorAll('.bldg').forEach(g => g.classList.remove('active'));
    if (!keys || keys.length === 0) {
      showingEl.textContent = 'Select or search an office';
      return;
    }
    keys.forEach(k => {
      const g = document.querySelector(`.bldg[data-key="${k}"]`);
      if (g) g.classList.add('active');
    });
    showingEl.textContent = `Highlighted: ${keys.join(', ').toUpperCase()}`;
  }

  let model = null;

  window.addEventListener('load', () => {
    qna.load().then(m => {
      model = m;
      statusEl.textContent = 'Directory model ready. Ask any question below.';
      askBtn.disabled = false;
    }).catch(err => {
      statusEl.textContent = 'Directory search active.';
      askBtn.disabled = false;
    });
  });

  async function processQuery() {
    const q = questionEl.value.trim().toLowerCase();
    const context = contextEl.value.trim();
    if (!q) return;

    askBtn.disabled = true;
    statusEl.textContent = 'Searching campus directory…';

    const isCanteenSearch = CANTEEN_TRIGGERS.some(trigger => q.includes(trigger));
    const isLibrarySearch = LIBRARY_TRIGGERS.some(trigger => q.includes(trigger));
    const isClinicSearch = CLINIC_TRIGGERS.some(trigger => q.includes(trigger));
    const isGuidanceSearch = GUIDANCE_TRIGGERS.some(trigger => q.includes(trigger));

    if (isCanteenSearch) {
      highlightKeys(['a_bldg', 'ea', 'ps']);
      locationTitle.textContent = 'Campus Canteens';
      answerDetails.innerHTML = `
        <p><strong>AUF Canteen Locations:</strong></p>
        <ul>
          <li><strong>Cabalen Canteen:</strong> 1st Floor, A Building (beside AUF Bookstore)</li>
          <li><strong>EA Canteen:</strong> 1st Floor, Emmanuel Angeles (EA) Building</li>
          <li><strong>PS Canteen:</strong> 1st Floor, Professional Schools (PS) Building</li>
        </ul>
      `;
      answerCard.classList.add('show');
      statusEl.textContent = 'Found 3 canteen locations!';
    } else if (isLibrarySearch) {
      highlightKeys(['library', 'ps']);
      locationTitle.textContent = 'Campus Libraries';
      answerDetails.innerHTML = `
        <p><strong>AUF Library Locations:</strong></p>
        <ul>
          <li><strong>Main Library & Learning Commons:</strong> Our Lady of Lourdes Hall (beside Quad A)</li>
          <li><strong>PS Library / Law Library:</strong> 3rd Floor, Professional Schools (PS) Building</li>
        </ul>
      `;
      answerCard.classList.add('show');
      statusEl.textContent = 'Found 2 library locations!';
    } else if (isClinicSearch) {
      highlightKeys(['it_bldg', 'ea']);
      locationTitle.textContent = 'Campus Clinics';
      answerDetails.innerHTML = `
        <p><strong>AUF Clinic Locations:</strong></p>
        <ul>
          <li><strong>University Health Services (UHS Clinic):</strong> 1st Floor, IT Building</li>
          <li><strong>EA Clinic:</strong> 1st Floor, Emmanuel Angeles (EA) Building</li>
        </ul>
      `;
      answerCard.classList.add('show');
      statusEl.textContent = 'Found 2 clinic locations!';
    } else if (isGuidanceSearch) {
      highlightKeys(['a_bldg', 'ea']);
      locationTitle.textContent = 'Guidance Counselor Offices';
      answerDetails.innerHTML = `
        <p><strong>AUF Guidance Counselor Locations:</strong></p>
        <ul>
          <li><strong>Main Guidance Office:</strong> Room A-303, AUF Main A Building</li>
          <li><strong>EA Guidance Office:</strong> Room EYA-101, 1st Floor, Emmanuel Angeles (EA) Building</li>
        </ul>
      `;
      answerCard.classList.add('show');
      statusEl.textContent = 'Found 2 guidance office locations!';
    } else {
      // 1. Check if user searched for a SPECIFIC SINGLE OFFICE
      const officeMatch = SPECIFIC_OFFICES.find(o => o.words.some(w => q.includes(w)));
      
      if (officeMatch) {
        highlightKeys([officeMatch.key]);
        locationTitle.textContent = officeMatch.name;
        answerDetails.innerHTML = `<p><strong>Location:</strong> ${officeMatch.location}</p>`;
        answerCard.classList.add('show');
        statusEl.textContent = 'Found location!';
      } else {
        // 2. Check if user searched for a WHOLE BUILDING
        const bldgMatch = BUILDINGS.find(b => b.words.some(w => q.includes(w)));
        if (bldgMatch) {
          highlightKeys([bldgMatch.key]);
          locationTitle.textContent = bldgMatch.name;
          answerDetails.innerHTML = bldgMatch.summary;
          answerCard.classList.add('show');
          statusEl.textContent = 'Found building!';
        } else if (model && context) {
          // 3. Fallback to TensorFlow Q&A model
          try {
            const answers = await model.findAnswers(q, context);
            if (answers && answers.length > 0) {
              const ansText = answers[0].text;
              locationTitle.textContent = 'Directory Answer';
              answerDetails.innerHTML = `<p><strong>Location:</strong> ${ansText}</p>`;
              answerCard.classList.add('show');

              const secMatch = BUILDINGS.find(b => b.words.some(w => ansText.toLowerCase().includes(w)));
              if (secMatch) highlightKeys([secMatch.key]);
              statusEl.textContent = 'Found!';
            } else {
              answerCard.classList.remove('show');
              highlightKeys([]);
              statusEl.textContent = 'No matching location found.';
            }
          } catch (e) {
            statusEl.textContent = 'Search failed.';
          }
        }
      }
    }

    askBtn.disabled = false;
  }

  askBtn.addEventListener('click', processQuery);
  questionEl.addEventListener('keyup', e => { if (e.key === 'Enter') processQuery(); });

  document.querySelectorAll('.examples button').forEach(btn => {
    btn.addEventListener('click', () => {
      questionEl.value = btn.dataset.q;
      processQuery();
    });
  });
</script>

</body>
</html>
